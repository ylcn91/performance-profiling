name: Temporary Emlakjet INP Probe

on:
  push:
    branches:
      - chatgpt/inp-probe-20260818
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Run interaction probe
        env:
          RUNS: '2'
          SETTLE_MS: '6000'
          AFTER_MS: '2500'
        run: node tools/temp-inp-probe.cjs
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inp-probe-results
          path: inp-results.json
          if-no-files-found: warn
          retention-days: 1
